<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Section</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="checkout-section" id="checkout">

    <div class="checkout-container">
        <div class="checkout-left">
            <p class="breadcrumb">
                Home / Shopping Cart / Checkout
            </p>
            <h1 class="checkout-heading">Checkout</h1>
            <div class="contact-details">
                <h2>Contact Details</h2>
                <label for="email">Email ID</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email ID"
                >
            </div>
            <div class="payment-section">
                <h2>Payment</h2>
                <div class="payment-options">
                    <div class="payment-option active-payment">
                        <span class="payment-icon">▣</span>
                        <span>Card</span>
                    </div>

                    <div class="payment-option">
                        <span class="payment-icon">₿</span>
                        <span>Crypto</span>
                    </div>

                    <div class="payment-option">
                        <span class="payment-icon">▤</span>
                        <span>Bank</span>
                    </div>

                </div>

                <div class="card-details">
                    <div class="input-group full-input">
                        <label for="card-number">
                            Card Number
                        </label>
                        <input
                            type="text"
                            id="card-number"
                            placeholder="1234 5678 9012 3456"
                        >
                    </div>

                    <div class="card-row">
                        <div class="input-group">
                            <label for="expiry">
                                Expiry
                            </label>
                            <input
                                type="text"
                                id="expiry"
                                placeholder="MM/YY"
                            >
                        </div>

                        <div class="input-group">
                            <label for="cvv">
                                CVV
                            </label>

                            <input
                                type="text"
                                id="cvv"
                                placeholder="123"
                            >
                        </div>
                    </div>

                    <div class="card-row">
                        <div class="input-group">
                            <label for="country">
                                Country
                            </label>

                            <select id="country">
                                <option value="">
                                    Select Country
                                </option>
                                <option>India</option>
                                <option>United States</option>
                                <option>United Kingdom</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label for="zipcode">
                                Zip Code
                            </label>
                            <input
                                type="text"
                                id="zipcode"
                                placeholder="Enter Zip Code"
                            >
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="checkout-right">
            <h1>Order Summary</h1>
            <div class="coupon-section">
                <label for="coupon">
                    Enter Coupon Code
                </label>

                <div class="coupon-input">
                    <input
                        type="text"
                        id="coupon"
                        placeholder="Enter Coupon Code"
                    >
                    <button>
                        Apply Coupon
                    </button>
                </div>
            </div>

            <div class="checkout-summary">
                <div class="summary-row">
                    <span>Sub Total</span>
                    <span>₹24,700</span>
                </div>

                <div class="summary-row">
                    <span>Taxes (if applicable)</span>
                    <span>₹199</span>
                </div>

                <div class="summary-row">
                    <span>Discount</span>
                    <span>₹0</span>
                </div>

                <div class="summary-row total-row">
                    <span>Total</span>
                    <strong>₹24,899</strong>
                </div>

            </div>

            <button class="pay-now-btn">
                Pay Now ₹24,899
            </button>

            <div class="payment-security">
                <span class="secure-payment">
                    🔒 SECURE
                </span>
                <strong>Razorpay</strong>
                <span>
                    🔐
                </span>
            </div>
        </div>
    </div>
</section>
</body>
</html>
